name: Build Desktop App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: Navigators-Windows
            add_data: "web;web"
          - os: ubuntu-latest
            artifact_name: Navigators-Linux
            add_data: "web:web"
          - os: macos-latest
            artifact_name: Navigators-macOS
            add_data: "web:web"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyinstaller

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconsole --onedir --add-data "${{ matrix.add_data }}" --name "Navigators" main.py

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/Navigators